name: deploy

on:
  pull_request:
  push:
    branches: [main]
    tags: ['v*']

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

# `package.json` depends on `@limccn/menhir-core` via `workspace:*`, and this repo is
# one package of the MemoryOverEth workspace. CI assembles that workspace:
#   workspace/
#   ├── pnpm-workspace.yaml
#   ├── menhir/          (sibling repo; @limccn/menhir-core lives in menhir/ts)
#   └── app/             (this repo)
# The menhir checkout needs a token with read access to that repo.

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout longstone-ui
        uses: actions/checkout@v4
        with:
          path: workspace/app
      - name: Checkout menhir (@limccn/menhir-core)
        uses: actions/checkout@v4
        with:
          repository: limccn/menhir
          token: ${{ secrets.MENHIR_REPO_TOKEN || github.token }}
          path: workspace/menhir
      - name: Assemble workspace
        working-directory: workspace
        run: |
          # `menhir/contracts` is deliberately absent: CI verifies the app and
          # the core library it imports, not the Solidity project (which needs
          # its own artifacts build and has no deploy step here).
          printf 'packages:\n  - "app"\n  - "menhir/ts"\nallowBuilds:\n  "@reown/appkit": true\n  "esbuild": true\n' > pnpm-workspace.yaml
          # No repo is checked out at the workspace root, so the assembled
          # workspace needs its own manifest: pnpm/action-setup reads
          # `packageManager` from here to pick the pnpm version.
          printf '{"name":"ci-workspace","private":true,"packageManager":"pnpm@12.11.2"}\n' > package.json
      # The action runs at the runner's workspace root (where no repo is
      # checked out), so point it at the assembled workspace's manifest.
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: workspace/package.json
      # No lockfile is checked in by either repo, so setup-node's pnpm cache
      # has nothing to key on (it would fail looking for workspace/pnpm-lock.yaml).
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: pnpm install --no-frozen-lockfile
        working-directory: workspace
      - run: pnpm --filter @limccn/menhir-core build
        working-directory: workspace
      # The digest rules are the cross-component contract: Solidity, the
      # browser, and scripts all rely on @limccn/menhir-core agreeing byte-for-byte.
      # Its tests must gate the app, not run only when someone remembers.
      - run: pnpm --filter @limccn/menhir-core test
        working-directory: workspace
      - run: pnpm --filter @limccn/menhir-core typecheck
        working-directory: workspace
      - run: pnpm --dir app typecheck
        working-directory: workspace
      - run: pnpm --dir app test
        working-directory: workspace
      # Bake the canonical registry address into the bundle. The app reads it
      # at build time; without this the deployed UI starts with an empty
      # registry and asks the visitor to configure one.
      - run: pnpm --dir app build
        working-directory: workspace
        env:
          VITE_REGISTRY_ADDRESS: ${{ vars.VITE_REGISTRY_ADDRESS }}
      - run: pnpm --dir app audit
        working-directory: workspace
      - run: pnpm audit --prod
        working-directory: workspace

  deploy:
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        platform: [vercel, cloudflare]
    runs-on: ubuntu-latest
    env:
      # Step-level `if` cannot read the `secrets` context directly. Project the
      # values into env so each platform's deploy steps skip cleanly until its
      # secrets are configured, instead of failing every push to main.
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - name: Checkout longstone-ui
        uses: actions/checkout@v4
        with:
          path: workspace/app
      - name: Checkout menhir (@limccn/menhir-core)
        uses: actions/checkout@v4
        with:
          repository: limccn/menhir
          token: ${{ secrets.MENHIR_REPO_TOKEN || github.token }}
          path: workspace/menhir
      - name: Assemble workspace
        working-directory: workspace
        run: |
          printf 'packages:\n  - "app"\n  - "menhir/ts"\nallowBuilds:\n  "@reown/appkit": true\n  "esbuild": true\n' > pnpm-workspace.yaml
          printf '{"name":"ci-workspace","private":true,"packageManager":"pnpm@12.11.2"}\n' > package.json
      # The action runs at the runner's workspace root (where no repo is
      # checked out), so point it at the assembled workspace's manifest.
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: workspace/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: pnpm install --no-frozen-lockfile
        working-directory: workspace
      - run: pnpm --filter @limccn/menhir-core build
        working-directory: workspace
      # Bake the canonical registry address into the bundle. The app reads it
      # at build time; without this the deployed UI starts with an empty
      # registry and asks the visitor to configure one.
      - run: pnpm --dir app build
        working-directory: workspace
        env:
          VITE_REGISTRY_ADDRESS: ${{ vars.VITE_REGISTRY_ADDRESS }}

      # PR → preview; push to main or a tag → production. Kept as separate
      # steps because GitHub expressions have no ternary: the common
      # `cond && '' || '--prod'` idiom is wrong (empty string is falsy).
      - name: Deploy preview to Vercel
        if: matrix.platform == 'vercel' && github.event_name == 'pull_request' && env.VERCEL_TOKEN != ''
        uses: amondnet/vercel-action@v25
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
          working-directory: workspace/app

      - name: Deploy production to Vercel
        if: matrix.platform == 'vercel' && github.event_name != 'pull_request' && env.VERCEL_TOKEN != ''
        uses: amondnet/vercel-action@v25
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
          working-directory: workspace/app
          vercel-args: '--prod'

      - name: Resolve Cloudflare Pages branch
        id: cf-ref
        if: matrix.platform == 'cloudflare'
        env:
          EVENT_NAME: ${{ github.event_name }}
          HEAD_REF: ${{ github.head_ref }}
        run: |
          if [ "$EVENT_NAME" = "pull_request" ]; then
            echo "branch=$HEAD_REF" >> "$GITHUB_OUTPUT"
          else
            echo "branch=main" >> "$GITHUB_OUTPUT"
          fi

      # `cloudflare/wrangler-action` installs wrangler with the project's
      # package manager. Inside this pnpm workspace npm cannot read the
      # `workspace:*` dependency, and pnpm refuses wrangler's workerd postinstall
      # (ERR_PNPM_IGNORED_BUILDS). `npx` with an explicit version installs
      # wrangler into its own cache instead, leaving the workspace untouched.
      - name: Deploy to Cloudflare Pages
        if: matrix.platform == 'cloudflare' && env.CLOUDFLARE_API_TOKEN != ''
        working-directory: workspace/app
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: >-
          npx --yes wrangler@4.151.1 pages deploy dist
          --project-name=${{ vars.CLOUDFLARE_PAGES_PROJECT || 'longstone-ui' }}
          --branch=${{ steps.cf-ref.outputs.branch }}
